# ── Resolution 512×512 (fine-tune from 256 checkpoint) ──────────────────────
resolution: 512
z_dim: 512
w_dim: 640
channel_base: 131072
channel_max: 512
mapping_layers: 12
mapping_lr_mul: 0.01

lr_g: 0.001
lr_d: 0.001
grad_clip: 1.0

d_reg_interval: 16
g_reg_interval: 4
r1_gamma: 10.0
pl_weight: 2.0
pl_decay: 0.01
# mean_path_length is NOT transferred from the 256 checkpoint (path-length scale differs by resolution).
# pl_warmup_steps > 0 prevents the first PL step from targeting 0 when loading a higher-res model.
pl_warmup_steps: 0
pl_batch_shrink: 4   # batch 8 → 2 for PL step; create_graph+fp32 doubles VRAM
r1_batch_shrink: 2   # batch 8 → 4 for R1 step; from_rgb@512px is 8×256×512×512×4=2GiB

batch_size: 8
num_workers: 4

total_kimg: 10000

log_interval: 100
sample_interval: 500
fid_interval: 2000
save_interval: 2000
n_fid_samples: 10000

use_amp: true
