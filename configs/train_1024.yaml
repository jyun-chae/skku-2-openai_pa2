# ── Resolution 1024×1024 (fine-tune from 512 checkpoint) ───────────────────
resolution: 1024
z_dim: 512
w_dim: 640
channel_base: 65536
channel_max: 512
mapping_layers: 12
mapping_lr_mul: 0.01

lr_g: 0.0005
lr_d: 0.0005
grad_clip: 1.0

d_reg_interval: 16
g_reg_interval: 4
r1_gamma: 50.0
pl_weight: 2.0
pl_decay: 0.01
pl_warmup_steps: 500  # mean_path_length is NOT transferred from 512 ckpt (starts at 0)

batch_size: 4
num_workers: 4

total_kimg: 10000

log_interval: 100
sample_interval: 500
fid_interval: 2000
save_interval: 2000
n_fid_samples: 10000

use_amp: true
