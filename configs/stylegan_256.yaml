generator:
  z_dim: 512
  resolutions: [4, 8, 16, 32, 64, 128, 256, 512, 1024]
  channels:
    4: 608
    8: 608
    16: 608
    32: 608
    64: 352
    128: 224
    256: 160
    512: 96
    1024: 64
  w_dim: 512
  mapping_layers: 4
  mapping_lr_mul: 0.01
  use_noise: true

discriminator:
  resolutions: [1024, 512, 256, 128, 64, 32, 16, 8, 4]
  channels:
    1024: 32
    512: 64
    256: 96
    128: 128
    64: 256
    32: 512
    16: 512
    8: 512
    4: 512
  use_spectral_norm: true
  minibatch_std_group: 4

training:
  stage: 256
  train_zip: data/train_50k_256.zip
  resolution: 256
  batch_size: 64
  total_images: 10_000_000
  num_workers: 8
  flip: true

  precision: bf16
  augment: color,translation

  lr_g: 0.001
  lr_d: 0.0003
  lr_warmup_steps: 1000
  lr_decay_start_steps: 15000
  lr_decay_steps: 60000
  lr_min_mult: 0.35
  beta1: 0.0
  beta2: 0.9
  weight_decay: 0.0

  grad_clip_g: 8.0
  grad_clip_d: 100.0

  r1_gamma: 5.0
  r1_lazy_every: 16

  ema_half_life: 5_000

  ckpt_every: 100_000
  ckpt_every_steps: 500

  log_every: 50
  fid_every_steps: 500
  fid_real_zip: data/valid_10k_256.zip
  fid_num_samples: 5000
  sample_n: 64
  sample_seed: 12345
  seed: 42

wandb:
  project: ffhqgen-student
  name: stylegan_256
  mode: online

out:
  run_dir: runs/stylegan_256
