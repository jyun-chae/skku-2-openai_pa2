generator:
  z_dim: 512
  resolutions: [4, 8, 16, 32, 64, 128, 256]
  channels:
    4: 608
    8: 608
    16: 608
    32: 608
    64: 352
    128: 224
    256: 160
  w_dim: 512
  mapping_layers: 4
  mapping_lr_mul: 0.01
  use_noise: true

discriminator:
  resolutions: [256, 128, 64, 32, 16, 8, 4]
  channels:
    256: 96
    128: 128
    64: 256
    32: 512
    16: 512
    8: 512
    4: 512
  use_spectral_norm: true
  minibatch_std_group: 4

training:
  stage: 256
  train_zip: data/train_50k_256.zip
  resolution: 256
  batch_size: 64
  total_images: 10_000_000
  num_workers: 8
  flip: true

  precision: fp32
  augment: color,translation

  lr_g: 0.001
  lr_d: 0.001
  beta1: 0.0
  beta2: 0.9
  weight_decay: 0.0

  grad_clip_g: 10.0
  grad_clip_d: 100.0

  r1_gamma: 10.0
  r1_lazy_every: 16

  ema_half_life: 10_000

  ckpt_every: 100_000
  ckpt_every_steps: 500

  log_every: 50
  sample_n: 64
  sample_seed: 12345
  seed: 42

wandb:
  project: ffhqgen-student
  name: stylegan_256
  mode: online

out:
  run_dir: runs/stylegan_256
