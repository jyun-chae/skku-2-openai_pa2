generator:
  z_dim: 512
  resolutions: [4, 8, 16, 32, 64, 128, 256, 512, 1024]
  channels:
    4: 600
    8: 600
    16: 600
    32: 600
    64: 352
    128: 224
    256: 160
    512: 96
    1024: 64
  w_dim: 512
  mapping_layers: 8
  mapping_lr_mul: 0.01
  use_noise: true
  w_avg_beta: 0.995

discriminator:
  resolutions: [1024, 512, 256, 128, 64, 32, 16, 8, 4]
  channels:
    1024: 32
    512: 64
    256: 96
    128: 128
    64: 256
    32: 512
    16: 512
    8: 512
    4: 512
  use_spectral_norm: true
  minibatch_std_group: 4

training:
  stage: 256
  train_zip: data/train_50k_256.zip
  resolution: 256
  batch_size: 64
  total_images: 10_000_000
  num_workers: 8
  flip: true

  precision: bf16
  augment: ""

  lr_g: 0.002
  lr_d: 0.002
  lr_warmup_steps: 0
  lr_decay_start_steps: 0
  lr_decay_steps: 0
  lr_min_mult: 1.0
  beta1: 0.0
  beta2: 0.99
  weight_decay: 0.0

  grad_clip_g: 8.0
  grad_clip_d: 100.0

  style_mixing_prob: 0.9

  r1_gamma: 10.0
  r1_lazy_every: 16

  path_regularize_weight: 2.0
  path_length_decay: 0.01
  path_length_batch_shrink: 2
  path_length_lazy_every: 4

  ema_kimg: 10
  ema_rampup: 0.05

  ckpt_every: 100_000
  ckpt_every_steps: 500

  log_every: 50
  fid_every_steps: 500
  fid_real_zip: data/valid_10k_256.zip
  fid_num_samples: 5000
  sample_n: 64
  sample_seed: 12345
  seed: 42

wandb:
  project: ffhqgen-student
  name: stylegan_256
  mode: online

out:
  run_dir: runs/stylegan_256
